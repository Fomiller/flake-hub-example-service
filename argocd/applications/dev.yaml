# Not generated. The pack writes the overlays; pointing a cluster at them is
# the cluster's business, so the Applications live here by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flake-hub-example-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fomiller/flake-hub-example-service
    targetRevision: main
    path: argocd/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: flake-hub-example-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
