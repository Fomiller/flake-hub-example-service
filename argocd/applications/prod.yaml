# Not generated. Same as dev but pointed at the prod overlay, and without
# automated sync — prod is promoted deliberately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flake-hub-example-service-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fomiller/flake-hub-example-service
    targetRevision: main
    path: argocd/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: flake-hub-example-service
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
