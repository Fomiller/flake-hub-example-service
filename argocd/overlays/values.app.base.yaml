# Written once, then it is yours. `nix run .#generate` never touches it again.
#
# Shared chart values. Every overlay inflates the chart with this file first
# and layers its own values.app.yaml on top, so a per-environment file only
# carries what actually differs.

fullnameOverride: flake-hub-example-service

replicas: 2

image:
  repository: 695434033664.dkr.ecr.us-east-1.amazonaws.com/flake-hub-example-service

# That registry is private, so the kubelet needs a credential to pull from it.
# external-secrets mints this Secret into every namespace labelled for it; the
# name has to match what that ClusterExternalSecret creates.
imagePullSecrets:
  - name: ecr-image-pull

# A request the scheduler can weigh. No CPU limit on purpose: throttling a
# request-sized container is worse than letting it burst on an idle node.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
